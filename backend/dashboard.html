<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de administrador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Julee&display=swap" rel="stylesheet">
<style>



    *{
        font-family: "Julee", cursive;
        font-size: 5vh;
        text-align: center;
        color: orange;
    } 

    body {
        background-image: url(/img/castle.jpeg);
        background-repeat: no-repeat;
        background-size:cover; 
        background-position: center;    
        background-attachment: fixed; /* ESENCIAL */
    }
    .contenedor-centrado {
        display:flex;
        width: 100%;
        justify-content: center;
    }

    .view {
    display: none;
}

    .view.active {
        display: block;
    }

    .navbar-index{
        margin: 0;
        padding: 0;
        top: 0;
        width: 100%;
        height: 40%;
        background-color: rgba(77, 49, 134, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        margin-bottom: 20px;
        box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.5);
        
    }


    .back {
    max-width: 40%;
    margin: 0 auto;
    padding: 20px;
    background-color: rgb(57, 14, 140, 0.5);
    border: 1px solid lightslategray;
    border-radius: 5px;
    box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.5);
    }


    .box {


        color: black;
        background-color: rgba(150, 150, 150, 0.75);

    
    
    }  


    button {
    padding: 8px;
    margin:4px;
    background-color: #007bff;
    color: #ffffff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    }
    button:hover {
    background-color: #0056b3;
    }


    a {
    padding: 8px;
    margin:4px;
    background-color: #fdab13;
    color: #1d1a39;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    text-decoration: none;
    font-size: 85%;
    font-weight: 800;
    }
    a:hover {
    background-color: #1d1a39;
    color:#fdab13
    }

    .home-tab {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: #ffee00;
            color: rgb(0, 0, 0);
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }
</style>
</head>

<body>

<header class="navbar">
    <h1>Magic Academy - Dashboard</h1>
</header>

<nav class="menu">

    
    <button onclick="renderCreate()">
        Ingreso de usuarios
    </button>

    <button onclick="renderRead()">
        Listado de usuarios
    </button>

</nav>

<main id="content">

    <!-- JavaScript renderiza acá -->

</main>

<script src="/backend/js/dashboard.js"></script>

</body>
</html>
